name: Frontend (React portal)

on:
  pull_request:
    branches: [main, version-16]
    paths:
      - "frontend-react/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main, version-16]
    paths:
      - "frontend-react/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-react

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint, errors fail the build)
        run: npx --yes oxlint@1.95.0 src

      - name: Production build
        run: npx vite build
